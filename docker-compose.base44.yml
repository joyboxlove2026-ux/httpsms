# Base44 sandbox stack for httpSMS.
#
# Development-only: every application service runs the code from this
# repository (bind-mounted at its working directory) behind a live-reload dev
# command, so edits are visible without rebuilding an image. The project's own
# docker-compose.yml builds production images and is left untouched.
#
#   web  -> http://localhost:3000  (Nuxt dev server)
#   api  -> http://localhost:8000  (Go API + Swagger UI)
#
# Credentials for external services (Firebase, SMTP, Turnstile) are delivered
# by the platform to /run/base44/app.env, which is listed LAST so the user's
# values always win over the placeholders in base44.defaults.env.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: httpsms
      POSTGRES_USER: dbusername
      POSTGRES_PASSWORD: dbpassword
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5435:5432"
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbusername -d httpsms"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s

  redis:
    image: redis:7
    command: ["redis-server"]
    volumes:
      - redis-data:/data
    restart: on-failure
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 24

  api:
    # Plain runtime image: the API source is bind-mounted and built at startup.
    image: golang:1.26-alpine
    working_dir: /app
    command: ["sh", "/usr/local/bin/base44-api-entrypoint.sh"]
    volumes:
      - ./api:/app
      - ./base44/api-entrypoint.sh:/usr/local/bin/base44-api-entrypoint.sh:ro
      - ./base44/air.toml:/app/.air.toml:ro
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    ports:
      - "8000:8000"
    environment:
      # Values that need the sandbox host at runtime (links in emails, Swagger).
      APP_URL: https://3000-${BASE44_PUBLIC_HOST_SUFFIX}
      SWAGGER_HOST: 8000-${BASE44_PUBLIC_HOST_SUFFIX}
    env_file:
      - ./base44.defaults.env
      - path: /run/base44/app.env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: on-failure
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-O",
          "/dev/null",
          "http://127.0.0.1:8000/health",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      # First start downloads Go modules and builds the whole API.
      start_period: 240s

  # One-shot: creates the system user documented in the README so the event
  # queue can authenticate against the API. Runs after the API has migrated.
  seed:
    image: postgres:16
    entrypoint:
      - sh
      - -ec
      - |
        psql -h postgres -U dbusername -d httpsms -v ON_ERROR_STOP=1 -c "
          INSERT INTO users (id, email, api_key, timezone, subscription_name, created_at, updated_at)
          VALUES ('system-user-id', 'system@httpsms.local', 'system-user-api-key', 'UTC', 'pro-monthly', NOW(), NOW())
          ON CONFLICT (id) DO NOTHING;"
    environment:
      PGPASSWORD: dbpassword
    depends_on:
      api:
        condition: service_healthy
    restart: "no"

  web:
    # Plain runtime image: Nuxt runs in dev mode from the bind-mounted source.
    image: node:22
    working_dir: /app
    command:
      - sh
      - -ec
      - |
        command -v pnpm >/dev/null 2>&1 || npm install -g pnpm@11.11.0
        HUSKY=0 CI=true pnpm install --frozen-lockfile
        exec pnpm dev --host 0.0.0.0 --port 3000
    volumes:
      - ./web:/app
      - web-node-modules:/app/node_modules
      - pnpm-store:/root/.local/share/pnpm/store
    ports:
      - "3000:3000"
    environment:
      # The browser talks to the API on its own public port.
      API_BASE_URL: https://8000-${BASE44_PUBLIC_HOST_SUFFIX}
      APP_URL: https://3000-${BASE44_PUBLIC_HOST_SUFFIX}
      # Set by the platform; Vite appends it to its allowed dev-server hosts.
      __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS:
    env_file:
      - ./base44.defaults.env
      - path: /run/base44/app.env
        required: false
    depends_on:
      api:
        condition: service_started
    restart: on-failure
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\"",
        ]
      interval: 10s
      timeout: 10s
      retries: 30
      # First start installs the pnpm workspace.
      start_period: 300s

volumes:
  postgres-data:
  redis-data:
  go-mod-cache:
  go-build-cache:
  web-node-modules:
  pnpm-store:
